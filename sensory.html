<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SENSORY LAB — 1minutes</title><link rel="stylesheet" href="./style.css"><style>main{max-width:1080px}.hero2{padding:65px 0 30px}.hero2 h1{font-size:clamp(50px,10vw,110px)}.chooser{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.chooser button{background:#1e2327;color:white;border:1px solid #555;padding:14px 6px}.chooser button[aria-pressed=true]{background:#4b6870}.lab{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.stage{position:relative;aspect-ratio:1.3;background:#0b1115;touch-action:manipulation}.stage canvas{width:100%;height:100%;display:block}.panel2{border:1px solid #444;padding:22px}.panel2 label{display:block;margin:15px 0;font-size:13px}.panel2 input{width:100%}.panel2 button{padding:12px 18px;margin-right:8px}.small{font-size:12px;color:#aaa}.bar{height:3px;background:#333}.bar div{height:100%;width:0;background:#bde1e6}@media(max-width:720px){.chooser{grid-template-columns:repeat(2,1fr)}.lab{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="./">1minute</a><span>EIGHT SENSORY STUDIES</span></header><main><section class="hero2"><div class="eyebrow">ONE MINUTE FOREVER / EIGHT NEW EXPERIMENTS</div><h1>SENSORY LAB.</h1><p class="lead">60秒で、感覚の世界へ。</p></section><div class="chooser" id="chooser"></div><section class="lab"><div class="stage" id="stage"><canvas id="canvas"></canvas></div><div class="panel2"><div class="eyebrow" id="number"></div><h2 id="name"></h2><p id="desc"></p><div id="controls"></div><button id="start">START 60 SEC</button><button id="save">SAVE PNG</button><div class="bar"><div id="bar"></div></div><p id="status" class="small">READY</p></div></section><section style="padding:50px 0"><h2>観察することから、始まる。</h2><p>心拍は入力値を使ったシミュレーションであり測定ではありません。共鳴と波紋は教育用の表現です。GROWTHは枝・葉脈・陰影・光を重ねた生成アートで、実写映像ではありません。錯視や光の変化で不快感があれば中止してください。</p><a href="./">← BACK TO THE MUSEUM</a></section></main><script src="./sensory.js?v=2"></script></body></html>
