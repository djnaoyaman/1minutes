name: Public exhibition verification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Wait for this checkout on GitHub Pages
        run: node scripts/wait-public.mjs
      - run: npm run test:browser
        env:
          TEST_BASE_URL: https://djnaoyaman.github.io/1minutes/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-review
          path: |
            playwright-report/
            test-results/
          retention-days: 7
