name: Public exhibition verification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact published assets, serially at least 65 seconds apart
        shell: bash
        run: node scripts/wait-public.mjs | tee public-verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-asset-verification
          path: public-verification.log
          retention-days: 7
